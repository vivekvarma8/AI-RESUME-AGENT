<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💼 AI Resume & Job Agent</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        h1 {
            text-align: center;
            color: #667eea;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 40px;
        }

        .form-section {
            margin-bottom: 30px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 10px;
            color: #333;
        }

        textarea {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            font-family: inherit;
            resize: vertical;
            transition: border-color 0.3s;
        }

        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .file-input {
            margin-bottom: 15px;
        }

        input[type="file"] {
            padding: 10px;
            border: 2px dashed #e0e0e0;
            border-radius: 10px;
            width: 100%;
            cursor: pointer;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .loading {
            display: none;
            text-align: center;
            margin: 20px 0;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #results {
            display: none;
            margin-top: 40px;
        }

        .result-card {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 20px;
        }

        .match-score {
            text-align: center;
            padding: 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 15px;
            margin-bottom: 30px;
        }

        .match-score h2 {
            font-size: 3em;
            margin-bottom: 10px;
        }

        .skills-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
            margin-top: 15px;
        }

        .skill-tag {
            background: #667eea;
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            text-align: center;
            font-size: 14px;
        }

        .skill-tag.missing {
            background: #dc3545;
        }

        .skill-tag.matched {
            background: #28a745;
        }

        .error {
            background: #dc3545;
            color: white;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            display: none;
        }

        .ai-recommendations {
            background: #fff;
            padding: 20px;
            border-left: 4px solid #667eea;
            line-height: 1.8;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>💼 AI Resume & Job Agent</h1>
        <p class="subtitle">Powered by Gemini AI, LangGraph & RAG</p>

        <form id="analysisForm">
            <div class="form-section">
                <label for="resume">📄 Resume (Upload PDF/DOCX or paste text)</label>
                <div class="file-input">
                    <input type="file" id="resumeFile" name="resume_file" accept=".pdf,.docx">
                </div>
                <textarea id="resumeText" name="resume_text" rows="8" 
                          placeholder="Or paste your resume text here..."></textarea>
            </div>

            <div class="form-section">
                <label for="job">💼 Job Description</label>
                <textarea id="jobDescription" name="job_description" rows="8" 
                          placeholder="Paste the job description here..." required></textarea>
            </div>

            <button type="submit" id="analyzeBtn">🔍 Analyze Match</button>
        </form>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p style="margin-top: 15px; color: #667eea; font-weight: 600;">
                Analyzing with AI Agent...
            </p>
        </div>

        <div class="error" id="error"></div>

        <div id="results">
            <div class="match-score">
                <h2 id="matchScore">0%</h2>
                <p>Overall Skill Match</p>
            </div>

            <div class="result-card">
                <h3 style="color: #28a745; margin-bottom: 15px;">
                    ✅ Matched Skills (<span id="matchedCount">0</span>)
                </h3>
                <div class="skills-grid" id="matchedSkills"></div>
            </div>

            <div class="result-card">
                <h3 style="color: #dc3545; margin-bottom: 15px;">
                    ❌ Missing Skills (<span id="missingCount">0</span>)
                </h3>
                <div class="skills-grid" id="missingSkills"></div>
            </div>

            <div class="result-card">
                <h3 style="margin-bottom: 15px;">🤖 AI-Powered Recommendations</h3>
                <div id="aiRecommendations" class="ai-recommendations"></div>
            </div>

            <div class="result-card">
                <h3 style="margin-bottom: 15px;">📊 Full Report</h3>
                <pre id="fullReport" style="white-space: pre-wrap; font-family: monospace; font-size: 14px;"></pre>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('analysisForm');
        const loading = document.getElementById('loading');
        const results = document.getElementById('results');
        const error = document.getElementById('error');
        const analyzeBtn = document.getElementById('analyzeBtn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            results.style.display = 'none';
            error.style.display = 'none';
            loading.style.display = 'block';
            analyzeBtn.disabled = true;

            try {
                const formData = new FormData(form);
                
                console.log('Sending request...');
                
                const response = await fetch('/analyze', {
                    method: 'POST',
                    body: formData
                });

                console.log('Response status:', response.status);

                const responseText = await response.text();
                console.log('Response:', responseText.substring(0, 200));

                let data;
                try {
                    data = JSON.parse(responseText);
                } catch (jsonError) {
                    console.error('JSON parse error:', jsonError);
                    console.error('Full response:', responseText);
                    throw new Error('Server returned invalid JSON');
                }

                if (!response.ok) {
                    throw new Error(data.error || 'Server error');
                }

                if (data.error) {
                    throw new Error(data.error);
                }

                console.log('Success!', data);
                displayResults(data);

            } catch (err) {
                console.error('Error:', err);
                error.textContent = '❌ ' + err.message;
                error.style.display = 'block';
            } finally {
                loading.style.display = 'none';
                analyzeBtn.disabled = false;
            }
        });

        function displayResults(data) {
            document.getElementById('matchScore').textContent = data.match_percentage + '%';

            document.getElementById('matchedCount').textContent = data.matched_skills.length;
            const matchedContainer = document.getElementById('matchedSkills');
            matchedContainer.innerHTML = data.matched_skills
                .map(skill => `<div class="skill-tag matched">${skill}</div>`)
                .join('');

            document.getElementById('missingCount').textContent = data.missing_skills.length;
            const missingContainer = document.getElementById('missingSkills');
            missingContainer.innerHTML = data.missing_skills
                .map(skill => `<div class="skill-tag missing">${skill}</div>`)
                .join('');

            document.getElementById('aiRecommendations').textContent = data.recommendations || 'No recommendations available';
            document.getElementById('fullReport').textContent = data.report || 'No report available';

            results.style.display = 'block';
            results.scrollIntoView({ behavior: 'smooth' });
        }
    </script>
</body>
</html>
